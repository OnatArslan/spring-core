spring:
  application:
    name: spring-core
  profiles:
    active: dev


own:
  legit: true
  rec-prefix: hello
id:
  type: uuid


orbit:
  workspace:
    default-plan: FREE
    max-projects-per-workspace: 10
    max-tasks-per-project: 100
    slug-prefix: ws
    max-slug-length: 40
  idgen:
    strategy: sequential
  notification:
    enabled: true
    channels: [console, memory]
    retry:
      max-attempts: 3
      backoff: PT2S
  audit:
    enabled: true
    slow-call-threshold: PT200MS

example:
  project:
    title-prefix: pr
    title-max-length: 250
    todo:
      title-prefix: td
      title-max-length: 250


logging:
  level:
    root: info
    orbit-info: debug
  group:
    orbit-info:
      - com.onatarslan.springcore.workspace
      - com.onatarslan.springcore.project

